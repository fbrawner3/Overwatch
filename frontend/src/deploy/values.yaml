# k3s-working/app-templates/hexmap/values.yaml
# bjw-s app-template — pin version to whatever is live in cluster
# hexmap.fndhome — internal only — NO NodePort

controllers:
  main:
    type: deployment
    replicas: 1
    strategy: Recreate
    containers:
      hexmap:
        image:
          repository: ghcr.io/deploy-user/hexmap
          tag: "0.1.0"
          pullPolicy: IfNotPresent
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 30
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /
                port: 8080
              initialDelaySeconds: 2
              periodSeconds: 10
              failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: [ALL]
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8080
        protocol: HTTP