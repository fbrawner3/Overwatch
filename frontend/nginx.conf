server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/prometheus/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
    }

    location /api/loki/ {
        proxy_pass http://loki:3100/;
        proxy_set_header Host $host;
    }

    location /api/k8s/ {
        proxy_pass https://10.0.0.53:6443/;
        proxy_ssl_verify off;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    location /api/authentik/ {
        proxy_pass https://auth.brawnandmoore.com/api/v3/;
        proxy_set_header Host auth.brawnandmoore.com;
        proxy_ssl_server_name on;
    }

    location /api/topology {
        proxy_pass http://hexmap-api:3010/topology;
        proxy_set_header Host $host;
    }

    location /api/infisical/ {
        proxy_pass http://infisical.fndhome/;
        proxy_set_header Host infisical.fndhome;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
